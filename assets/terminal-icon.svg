<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Main rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#body)"/>

  <!-- Inner shadow / bevel -->
  <rect x="18" y="18" width="476" height="476" rx="98" ry="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top highlight -->
  <rect x="16" y="16" width="480" height="200" rx="100" ry="100" fill="url(#shine)"/>

  <!-- > chevron -->
  <polyline points="155,175 275,258 155,341" fill="none" stroke="white" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- _ cursor bar -->
  <rect x="300" y="310" width="80" height="24" rx="4" fill="rgba(180,180,180,0.6)"/>
</svg>
