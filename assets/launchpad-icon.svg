<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Main rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Inner bevel -->
  <rect x="18" y="18" width="476" height="476" rx="98" ry="98" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- Top highlight -->
  <rect x="16" y="16" width="480" height="200" rx="100" ry="100" fill="url(#shine)"/>

  <!-- 3x3 Grid of colored squares -->
  <!-- Row 1 -->
  <rect x="120" y="120" width="80" height="80" rx="18" fill="#4CD964"/>
  <rect x="216" y="120" width="80" height="80" rx="18" fill="#FFCC00"/>
  <rect x="312" y="120" width="80" height="80" rx="18" fill="#FF9500"/>
  <!-- Row 2 -->
  <rect x="120" y="216" width="80" height="80" rx="18" fill="#FF3B30"/>
  <rect x="216" y="216" width="80" height="80" rx="18" fill="#8E8E93"/>
  <rect x="312" y="216" width="80" height="80" rx="18" fill="#FF2D55"/>
  <!-- Row 3 -->
  <rect x="120" y="312" width="80" height="80" rx="18" fill="#AF52DE"/>
  <rect x="216" y="312" width="80" height="80" rx="18" fill="#007AFF"/>
  <rect x="312" y="312" width="80" height="80" rx="18" fill="#34C759"/>
</svg>