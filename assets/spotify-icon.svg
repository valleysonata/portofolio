<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#191414"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="green" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </radialGradient>
  </defs>

  <!-- Main rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Inner bevel -->
  <rect x="18" y="18" width="476" height="476" rx="98" ry="98" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Top highlight -->
  <rect x="16" y="16" width="480" height="200" rx="100" ry="100" fill="url(#shine)"/>

  <!-- Green circle -->
  <circle cx="256" cy="256" r="150" fill="url(#green)"/>

  <!-- Sound wave lines -->
  <path d="M200,230 Q220,210 256,210 Q292,210 312,230" fill="none" stroke="#191414" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M210,260 Q230,245 256,245 Q282,245 302,260" fill="none" stroke="#191414" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M220,290 Q235,278 256,278 Q277,278 292,290" fill="none" stroke="#191414" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
</svg>